[project]
name = "commuter-sim"
version = "0.1.0"
description = "Simulate and compare commuting by bike, public transport and car using weather, transit and event data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "astral>=3.2",
    "tzdata>=2024.1",   # zoneinfo on Windows has no system tz database
]

[dependency-groups]   # installed by default with `uv sync`
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
